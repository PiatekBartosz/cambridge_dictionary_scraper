[package]
name = "cambridge-dictionary-scraper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cam"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
scraper = "0.27.0"

[dev-dependencies]
